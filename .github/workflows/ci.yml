name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  test:
    # GitHub-hosted runner — zero setup required. Swap to a self-hosted
    # runner by changing this to `runs-on: self-hosted` once one is
    # registered under Settings -> Actions -> Runners for this repo.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Booking API smoke test
        run: node scripts/smoke-test.js

      - name: Check no leftover debug/test artifacts are tracked
        run: |
          if git ls-files | grep -qE '^scripts/shots/'; then
            echo "Found committed screenshot artifacts under scripts/shots/ — these should never be tracked." >&2
            exit 1
          fi
